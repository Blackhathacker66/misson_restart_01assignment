<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftCart | Modern eCommerce</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header id="navbar">
        <div class="container nav-container">
            <a href="#" class="logo">SwiftCart</a>

            <nav class="nav-links">
                <a href="#hero" class="active">Home</a>
                <a href="#products">Products</a>
                <a href="#about">About</a>
                <a href="#contact">Contact</a>
            </nav>

            <div class="nav-actions">
                <div class="cart-icon" id="cart-btn">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="cart-count">0</span>
                </div>
                <div class="hamburger" id="hamburger">
                    <i class="fa-solid fa-bars"></i>
                </div>
            </div>
        </div>
    </header>

    <section id="hero">
        <div class="hero-overlay"></div>
        <div class="container hero-content">
            <h1>Best Collection For You</h1>
            <p>Discover the latest trends in fashion and electronics. Shop with confidence and style at SwiftCart today.
            </p>
            <a href="#products" class="btn btn-primary">Shop Now</a>
        </div>
    </section>

</body>

</html>
